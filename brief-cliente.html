:root{--bg:#f5f7f7;--surface:#ffffff;--ink:#0d1a19;--muted:#46585a;--line:#b9c6c5;--accent:#0b6b63;--accent-ink:#ffffff;--soft:#dff1ee;--err:#a3190f;
--display:"Bricolage Grotesque","Segoe UI",Arial,sans-serif;--body:"DM Sans","Segoe UI",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1514;--surface:#15211f;--ink:#f0f7f6;--muted:#b3c5c2;--line:#46605c;--accent:#4fd1bf;--accent-ink:#04201c;--soft:#173a35;--err:#ff9b8d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1514;--surface:#15211f;--ink:#f0f7f6;--muted:#b3c5c2;--line:#46605c;--accent:#4fd1bf;--accent-ink:#04201c;--soft:#173a35;--err:#ff9b8d;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.6;padding-inline:16px;padding-block:28px}
main{max-width:740px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--display);font-size:clamp(2rem,7vw,2.8rem);line-height:1.12;margin:0 0 8px;text-wrap:balance}
.intro{margin:0;color:var(--muted)}
.lang{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lang button{font:inherit;font-size:.9rem;font-weight:700;padding:6px 12px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.lang button[aria-pressed=true]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:4px}
.track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.bar small{color:var(--muted);font-size:.85rem}
fieldset{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:20px 18px 6px;margin:0;min-width:0}
legend{font-family:var(--display);font-weight:700;font-size:1.3rem;padding-inline:8px}
.f{display:flex;flex-direction:column;gap:8px;margin-bottom:22px;min-width:0}
label,.lab{font-weight:700}
.hint{display:block;color:var(--muted);font-size:.9rem;font-weight:400}
.req{color:var(--err);font-weight:700}
input[type=text],input[type=email],input[type=tel],input[type=url],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:12px 14px}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,.opt:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.opt{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:8px;padding:12px 14px;font-weight:500;cursor:pointer;background:var(--bg);min-height:50px}
.opt input{width:22px;height:22px;flex:none;accent-color:var(--accent);margin:0}
.opt:has(input:checked){border-color:var(--accent);background:var(--soft)}
.err{color:var(--err);font-weight:700;font-size:.95rem}
.row{display:flex;gap:12px;flex-wrap:wrap}
button.big{font:inherit;font-weight:700;border-radius:8px;padding:14px 26px;cursor:pointer;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
button.big.ghost{background:transparent;color:var(--accent)}
button:disabled{opacity:.6;cursor:wait}
.done{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:14px}
.done h2{font-family:var(--display);margin:0;font-size:1.6rem}
.done p{margin:0}
.done textarea{min-height:320px;font-size:.95rem}
.ok{color:var(--accent);font-weight:700}
@media (prefers-reduced-motion:reduce){.track i{transition:none}}
</style>

var $=function(s){return document.querySelector(s)};
var form=$("#form"),state={},lang="it",doneShown=false;
try{var sv=localStorage.getItem("lang");if(sv&&LANGS.some(function(l){return l[0]===sv}))lang=sv;else{var nl=(navigator.language||"it").slice(0,2);if(LANGS.some(function(l){return l[0]===nl}))lang=nl}}catch(e){}
function li(){for(var i=0;i<LANGS.length;i++)if(LANGS[i][0]===lang)return i;return 1}
function T(a){return a[li()]||a[1]}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function build(){
 $("#h1").textContent=T(U.title);$("#intro").textContent=T(U.intro);document.documentElement.lang=lang;
 $("#lang").innerHTML=LANGS.map(function(l){return '<button type="button" data-l="'+l[0]+'" aria-pressed="'+(l[0]===lang)+'">'+l[1]+'</button>'}).join("");
 var h="",n=0;
 SECS.forEach(function(sec,i){
  h+='<fieldset><legend>'+(i+1)+'. '+esc(T(sec.t))+'</legend>';
  sec.f.forEach(function(f){
   var lab=esc(T(f.l))+(f.req?' <span class="req" aria-hidden="true">*</span>':'')+(f.h?'<span class="hint">'+esc(T(f.h))+'</span>':'');
   var v=state[f.id];
   h+='<div class="f">';
   if(f.k==="check"||f.k==="radio"){
    h+='<div class="lab" id="l_'+f.id+'">'+lab+'</div><div class="opts" role="'+(f.k==="radio"?"radiogroup":"group")+'" aria-labelledby="l_'+f.id+'">';
    f.o.forEach(function(o,j){
     var on=f.k==="check"?(v||[]).indexOf(j)>-1:v===j;
     h+='<label class="opt" for="'+f.id+'_'+j+'"><input id="'+f.id+'_'+j+'" type="'+(f.k==="check"?"checkbox":"radio")+'" name="'+f.id+'" value="'+j+'"'+(on?" checked":"")+'><span>'+esc(T(o))+'</span></label>';
    });
    h+='</div>';
   }else if(f.k==="select"){
    h+='<label for="'+f.id+'">'+lab+'</label><select id="'+f.id+'" name="'+f.id+'"><option value="">'+esc(T(U.select))+'</option>'+f.o.map(function(o,j){return '<option value="'+j+'"'+(v===j?" selected":"")+'>'+esc(T(o))+'</option>'}).join("")+'</select>';
   }else if(f.k==="area"){
    h+='<label for="'+f.id+'">'+lab+'</label><textarea id="'+f.id+'" name="'+f.id+'">'+esc(v||"")+'</textarea>';
   }else{
    h+='<label for="'+f.id+'">'+lab+'</label><input id="'+f.id+'" name="'+f.id+'" type="'+f.k+'" value="'+esc(v||"")+'" autocomplete="off">';
   }
   h+='<div class="err" id="e_'+f.id+'" role="alert"></div></div>';
  });
  h+='</fieldset>';
 });
 h+='<div class="row"><button class="big" type="submit" id="send">'+esc(T(U.send))+'</button></div>';
 form.innerHTML=h;progress();
}
function read(){
 ALL.forEach(function(f){
  if(f.k==="check"){state[f.id]=[].slice.call(form.querySelectorAll('[name="'+f.id+'"]:checked')).map(function(x){return +x.value})}
  else if(f.k==="radio"){var x=form.querySelector('[name="'+f.id+'"]:checked');state[f.id]=x?+x.value:undefined}
  else if(f.k==="select"){var s=form.elements[f.id].value;state[f.id]=s===""?undefined:+s}
  else{state[f.id]=form.elements[f.id].value.trim()}
 });
}
function filled(v){return Array.isArray(v)?v.length>0:(v!==undefined&&v!=="")}
function progress(){
 var ok=0;ALL.forEach(function(f){if(filled(state[f.id]))ok++});
 $("#prog").style.width=(100*ok/ALL.length)+"%";
 $("#progtxt").textContent=ok+" / "+ALL.length;
}
function answerText(f,v){
 if(f.k==="check")return v.map(function(j){return f.o[j][0]}).join(", ");
 if(f.k==="radio"||f.k==="select")return f.o[v][0];
 return v;
}
function summary(){
 var t="BRIEF CLIENTE\nLingua del cliente: "+lang.toUpperCase()+"\n";
 SECS.forEach(function(s){
  var ls=[];s.f.forEach(function(f){var v=state[f.id];if(filled(v))ls.push("- "+f.l[0].replace(/\?$/,"")+": "+answerText(f,v))});
  if(ls.length)t+="\n"+s.t[0].toUpperCase()+"\n"+ls.join("\n")+"\n";
 });
 return t;
}
function getDb(){
 return new Promise(function(res){
  var done=false;function fin(v){if(!done){done=true;res(v)}}
  setTimeout(function(){fin(null)},4000);
  try{if(window.claude&&window.claude.use){window.claude.use("db").then(fin,function(){fin(null)})}else fin(null)}catch(e){fin(null)}
 });
}
function showDone(saved,txt){
 doneShown=true;form.hidden=true;$("#bar").hidden=true;
 var D=$("#done");D.hidden=false;
 D.innerHTML='<h2>'+esc(T(saved?U.thanks:["Ultimo passaggio","Last step","Último paso","Dernière étape","Letzter Schritt"]))+'</h2><p>'+esc(T(saved?U.savedNote:U.notSaved))+'</p>'
 +'<label class="lab" for="sum" style="display:none">Riepilogo</label><textarea id="sum" readonly></textarea>'
 +'<div class="row"><button class="big" type="button" id="copy">'+esc(T(U.copy))+'</button><button class="big ghost" type="button" id="back">'+esc(T(U.back))+'</button></div><p class="ok" id="cmsg" role="status"></p>';
 $("#sum").value=txt;
 $("#copy").onclick=function(){
  var ta=$("#sum"),m=$("#cmsg");
  function manual(){ta.focus();ta.select();try{ta.setSelectionRange(0,999999)}catch(e){};
   var okc=false;try{okc=document.execCommand("copy")}catch(e){}
   m.textContent=T(okc?U.copied:U.copyManual)}
  try{navigator.clipboard.writeText(txt).then(function(){m.textContent=T(U.copied)},manual)}catch(e){manual()}
 };
 $("#back").onclick=function(){doneShown=false;D.hidden=true;form.hidden=false;$("#bar").hidden=false;build();scrollTo({top:0})};
 scrollTo({top:0});
}
document.addEventListener("click",function(e){
 var b=e.target.closest&&e.target.closest("#lang button");if(!b)return;
 read();lang=b.getAttribute("data-l");try{localStorage.setItem("lang",lang)}catch(x){}
 if(doneShown){showDone(false,summary())}else build();
});
form.addEventListener("input",function(){read();progress()});
form.addEventListener("change",function(){read();progress()});
form.addEventListener("submit",function(e){
 e.preventDefault();read();
 var bad=null;
 ALL.forEach(function(f){
  var el=$("#e_"+f.id),v=state[f.id];el.textContent="";
  if(f.req&&!filled(v)){el.textContent=T(U.required);bad=bad||el}
  else if(f.k==="email"&&v&&!/^\S+@\S+\.\S+$/.test(v)){el.textContent=T(U.emailErr);bad=bad||el}
 });
 if(bad){bad.scrollIntoView({block:"center",behavior:"smooth"});return}
 var txt=summary(),btn=$("#send");btn.disabled=true;btn.textContent=T(U.saving);
 getDb().then(function(db){
  if(!db)return false;
  var rec={};ALL.forEach(function(f){var v=state[f.id];if(filled(v))rec[f.id]=answerText(f,v)});
  rec.lingua=lang;rec.inviatoIl=new Date().toISOString();rec.riepilogo=txt;
  return db.collection("responses").add(rec).then(function(){return true},function(){return false});
 }).then(function(saved){showDone(!!saved,txt)},function(){showDone(false,txt)});
});
build();
</script>
